[package]
name = "anime-pulse-worker"
version = "0.1.0"
edition = "2021"
authors = ["Muhammad Daffa Ma'arif <schnee>"]
description = "Ultra-low-latency Cloudflare Worker in Rust for anime release tracking"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = "0.8.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1.10"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
