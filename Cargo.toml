[package]
name = "anime-pulse-worker"
version = "0.1.0"
edition = "2021"
authors = ["Muhammad Daffa Ma'arif <schnee>"]
description = "Ultra-low-latency Cloudflare Worker in Rust for anime release tracking"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = "0.8.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1.10"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

# Cold isolates pay to download and instantiate this module on every tick, so
# size is a runtime cost, not just a packaging detail. The default release
# profile shipped a 2.66 MB module; these settings cut it to ~1.77 MB (-34%).
# `panic = "abort"` is safe here: the crate installs no panic hook.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
