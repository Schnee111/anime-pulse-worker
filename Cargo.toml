[package]
name = "anime-pulse-worker"
version = "0.1.0"
edition = "2021"
authors = ["Muhammad Daffa Ma'arif <schnee>"]
description = "Ultra-low-latency Cloudflare Worker in Rust for anime release tracking"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = "0.8.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1.10"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

# Cold isolates pay to download and instantiate this module on every tick, so
# size is a runtime cost, not just a packaging detail.
#
# `strip = true` is fatal here: worker-build invokes wasm-bindgen with
# `--force-enable-abort-handler`, and a full strip removes the externref table
# its catch wrappers need ("externref table required for catch wrappers"),
# which fails the deploy. `strip = "debuginfo"` keeps the table and still
# shrinks the shipped module from 1.61 MB to 1.33 MB.
#
# `panic = "abort"` is left out only because it measured no smaller (1408.63
# KiB vs 1407.98 KiB upload); it is verified NOT to break the build when
# combined with `strip = "debuginfo"`.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
