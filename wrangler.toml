name = "anime-pulse-worker"
main = "build/worker/shim.mjs"
compatibility_date = "2024-04-03"

[build]
command = "cargo install -q worker-build && worker-build --release"

[[kv_namespaces]]
binding = "ANIME_KV"
id = "anime_pulse_kv"
preview_id = "anime_pulse_kv_preview"

[triggers]
crons = ["* * * * *"]

[vars]
ENVIRONMENT = "production"
