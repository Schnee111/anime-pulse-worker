name = "anime-pulse-worker"
main = "build/worker/shim.mjs"
compatibility_date = "2024-04-03"

[build]
command = "worker-build --release"

[[kv_namespaces]]
binding = "ANIME_KV"
id = "5194b3ac8f664de4bbe1a89fb982275f"
preview_id = "ab52264ad70f4f82b2e460d0e757874c"

[triggers]
crons = ["* * * * *"]

# Strongly consistent dedupe for announced episodes. KV cannot serve this role:
# its reads can lag a write by up to a minute, which is the exact window that
# produces duplicate cards (issue #43). One instance named "global" serializes
# every claim through the same storage.
[[durable_objects.bindings]]
name = "DELIVERY_LEDGER"
class_name = "DeliveryLedger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeliveryLedger"]

[vars]
ENVIRONMENT = "production"
